[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /api/v2/version відкритий без логіна — його ж використовує healthcheck у docker-compose
healthcheckPath = "/api/v2/version"
# standalone стартує довго: міграція бази + розбір DAG-ів
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
